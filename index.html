<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Final Project submission for WDD330, react and travel to global eruptions">
<meta name="author" content="James P Kingsley">
<title>Volcano Chasers || WDD330</title>

<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/larger.css">
<script type="module" src="scripts/main.mjs" ></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<link rel="icon" href="images/logo.svg">
</head>

<body>
    <span id="main-header"></span>
    <main>
        <h1>Current Eruptions</h1>
        <div id="hero" class="twoCol">
            <picture>
                <source srcset="images/hero-large.webp" media="(min-width: 608px)">
                <img src="images/hero-small.webp" alt="Erupting Volcano" width="500" height="250" loading="lazy">
            </picture>
        </div>
        <div id="active">
            <h2>Active Volcano</h2>
            <p><em>Watch levels: Yellow, Orange, Red</em></p>
        </div>
        <div>
            <h2>Favorite Volcano</h2>
            <p id="favVolcano"> Favorite has not yet been selected! Please Select favorite on Historic Eruptions page!</p>
        </div>
    </main>
    <footer id="main-footer"></footer>
</body>
</html>
